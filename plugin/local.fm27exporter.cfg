## Settings file was created by plugin FM27 Exporter v1.0.0
## Plugin GUID: local.fm27exporter

[Display]

## Show export progress and result at the top of the screen.
# Setting type: Boolean
# Default value: true
ShowStatus = true

[Export]

## Raise a frame-rate cap below 60 fps to 60 while exporting; restored afterwards. Can cause instability on some Linux/Intel setups.
# Setting type: Boolean
# Default value: false
UnlockFrameRate = false

## Stop after this many rows.
# Setting type: Int32
# Default value: 25000
MaxRows = 25000

## Export only the selected rows when at least this many are selected. 0 = always export all rows.
# Setting type: Int32
# Default value: 2
SelectedRowsMinimum = 2

## After each scroll step, wait until the visible rows stay unchanged for this many frames.
# Setting type: Int32
# Default value: 3
StableFrames = 3

## …but read a step anyway once this many frames AND MaxSettleSeconds have passed.
# Setting type: Int32
# Default value: 90
MaxSettleFrames = 90

## Time part of that limit, in seconds.
# Setting type: Single
# Default value: 2
MaxSettleSeconds = 2

[Keys]

## Key that exports the table on screen (FM24 used Ctrl+P, which FM27 uses for Preferences). Examples: F8, Ctrl+F9, Alt+E.
# Setting type: String
# Default value: F8
Export = F8

## Writes a description of the UI on screen to <output>/diagnostics — attach it to a bug report if an export goes wrong.
# Setting type: String
# Default value: Shift+F8
Diagnostics = Shift+F8

## Adds every player attribute column to the current custom view of the table under the mouse (as the game's header menu "Insert Column" would, one by one).
# Setting type: String
# Default value: Ctrl+F8
AddAttributeColumns = Ctrl+F8

[Output]

## Comma-separated: html = FM24 'Web Page', rtf = FM24 'Text File', csv = spreadsheet CSV.
# Setting type: String
# Default value: html,rtf,csv
Formats = html,rtf,csv

## Output folder. Empty = Documents/Sports Interactive/Football Manager 27/exports.
# Setting type: String
# Default value: 
Folder = 

## CSV field separator: ',' or ';' (for Excel with a decimal comma) or 'tab'.
# Setting type: String
# Default value: ,
CsvDelimiter = ,

## Add date and time to file names (else an existing file gets ' (2)').
# Setting type: Boolean
# Default value: true
Timestamp = true

## Leave out columns without header and without values (e.g. the selection checkbox column).
# Setting type: Boolean
# Default value: true
DropEmptyColumns = true

